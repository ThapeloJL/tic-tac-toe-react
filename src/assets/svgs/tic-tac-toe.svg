<svg viewBox="0 0 300 300"  height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid lines -->
  <g stroke="darkgray" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="15"  x2="100" y2="285" />
    <line x1="200" y1="15"  x2="200" y2="285" />
    <line x1="15"  y1="100" x2="285" y2="100" />
    <line x1="15"  y1="200" x2="285" y2="200" />
  </g>

  <!-- X in top-left cell -->
  <g stroke="#ff2329" stroke-width="8" stroke-linecap="round">
    <line x1="28" y1="28" x2="72" y2="72" />
    <line x1="72" y1="28" x2="28" y2="72" />
  </g>

  <!-- O in center cell -->
  <circle cx="150" cy="150" r="25" fill="none" stroke="#0030f3" stroke-width="8" />

  <!-- X in bottom-right cell -->
  <g stroke="#ff2329" stroke-width="8" stroke-linecap="round">
    <line x1="228" y1="228" x2="272" y2="272" />
    <line x1="272" y1="228" x2="228" y2="272" />
  </g>
</svg>